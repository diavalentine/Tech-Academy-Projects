<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Basic AJAX Demo</title>
	<link rel="stylesheet" href="style.css">

</head>

<body>
	<!--this section fetches the user's name with AJAX-->
	<div class='container' id="content">
		<h1>Sign up for our Newsletter</h1>
		<div class="display">
			<form>
				<input id="fullName" placeholder="Name">
				<input placeholder="Email">
				<input onclick="getMsg();" type="button" class="btn" value="Submit" onclick="getMsg();"/>
			</form>
		</div>
	</div>
	<!--this section uses AJAX to load content from content.html -->
	<div>
		<h3>Click the button below to load content with AJAX!</h3>
		<button onclick="loadContent()">Click here!</button>
		<div id="content2"></div>
	</div>
	<script src="ajaxScript.js"></script>
</body>
</html>
