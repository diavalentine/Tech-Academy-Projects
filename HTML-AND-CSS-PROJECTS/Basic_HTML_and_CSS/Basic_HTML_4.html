<!DOCTYPE html>
<html>
	<body>
	<section>
	<style>
	.font_1 {
		background-color: black;
		color: yellow;
		font-size: large;
	}
	.font_2 {
		background-color: darkblue;
		color: white;
		font-size: medium;
	}
	.font_3 {
		background-color: mediumorchid;
		color: darkblue;
		font-style: italic;
		font-size: large;
	}
	</style>
	</section>
	<section>
	<h2 class="font_1">This h2 element is </h2><span style="font_2">styled</span> <h2 class="font_1">per class attribute font_1</h2>
	<h3 class="font_2"> &nbsp;This h3 element is styled per class attribute font_2</h3>
	<h4 class="font_1">Even though this is an h4 element, it is styled the same
	as the h2 element because we pointed to the class attribute font_1</h4>
		<p class="font_3">This is my own class attribute that I made up!</p>
	</section>
	</body>
</html>
