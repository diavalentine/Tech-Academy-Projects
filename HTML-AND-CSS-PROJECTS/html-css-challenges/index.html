<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Gudetama Test Website</title>
        <link rel="stylesheet" href="css/custom.css">
    </head>
    <body>
        <!--navbar-->
        <div class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
        <br>
        <br>
        <!--image with text-->
        <div class="spacer container image-container">
            <img src="images/gude4.jfif" alt="Gudetama image" class="center" id="gude4">
            <div class="center-bottom">This is text on a gudetama</div>
            <div class="overlay"><h3>You must really like eggs, huh?</h3></div>
        </div>
        <!--video-->
        <div class="spacer">
            <video autoplay muted loop><source src="images/cafe.mp4" type="video/mp4"></video>
            <div class="center-bottom">This is text on a video</div>
        </div>
        <!--table-->
        <div class="spacer">
            <table>
                <tr>
                    <th>This</th>
                    <th>Is</th>
                    <th>A</th>
                    <th>Table</th>
                </tr>
                <tr>
                    <td>With</td>
                    <td>Some</td>
                    <td>Words</td>
                    <td>Inside</td>
                </tr>
                <tr>
                    <td>And</td>
                    <td>Some</td>
                    <td>More</td>
                    <td>Words</td>
                </tr>
            </table>
        </div>
        <!--2 column layout -->
        <div class="row">
            <div class="column">Left Column</div>
            <div class="column">Right Column</div>
        </div>
        <div class="spacer"></div>
        <!--footer-->
        <footer>
            <p>Dia Valentine's Test Website, featuring Gudetama!</p>
        </footer>
    </body>
</html>
