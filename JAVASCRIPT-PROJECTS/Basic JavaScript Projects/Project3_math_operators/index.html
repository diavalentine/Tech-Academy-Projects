<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Math Test</title>
        <script src="JS/main.js"></script>
    </head>
    <body>
        <!--These p elements perform different math functions-->
        <p id="add" onclick="add(12, 18)">Click here to add</p>
        <p id="subtract" onclick="subtract(12, 18)">Click here to subtract</p>
        <p id="multiply" onclick="multiply(12, 18)">Click here to multiply</p>
        <p id="mod" onclick="mod(12, 18)">Click here to find remainder</p>
        <p id="inc" onclick="inc(12)">Click here to increment</p>
        <p id="dec" onclick="dec(12)">Click here to decrement</p>
        <p id="rand" onclick="rand()">Click here to for a random number between 0 and 100</p>
    </body>
</html>
